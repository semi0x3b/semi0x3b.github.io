<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 410" role="img" aria-label="dev 플랫폼 전체 흐름: 코드가 없는 EKS를 실측해 Terraform 스택 여섯 갈래로 옮기고, apply로 OCI 플랫폼을 만든 뒤, 클러스터 밖의 Git과 Vault와 이미지 레지스트리가 클러스터 안의 서비스군과 배치 Job을 채운다">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: currentColor; }
    .name { font-size: 13px; font-weight: 600; }
    .plain { font-size: 13px; }
    .sub { font-size: 11px; opacity: .7; }
    .edge-lbl { font-size: 11px; opacity: .7; }
    .zone { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 4 3; rx: 8; opacity: .3; }
    .zone-lbl { font-size: 11px; font-weight: 600; opacity: .5; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.5; rx: 6; opacity: .55; }
    .box-code { fill: none; stroke: #43809c; stroke-width: 2; rx: 6; }
    .flow { stroke: currentColor; stroke-width: 1.5; fill: none; opacity: .6; }
    .flow-dot { stroke: currentColor; stroke-width: 1.3; fill: none; stroke-dasharray: 5 3; opacity: .5; }
    .coin { font-size: 11px; font-weight: 600; fill: #e8590c; }
  </style>
  <defs>
    <marker id="o-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <rect x="24" y="40" width="150" height="64" class="box"/>
  <text x="99" y="66" text-anchor="middle" class="name">콘솔뿐인 EKS</text>
  <text x="99" y="86" text-anchor="middle" class="sub">코드도 히스토리도 없음</text>

  <rect x="252" y="40" width="190" height="64" class="box-code"/>
  <text x="347" y="66" text-anchor="middle" class="name">Terraform 코드</text>
  <text x="347" y="86" text-anchor="middle" class="sub">platform + 서비스별 다섯</text>
  <text x="252" y="122" class="coin">스택 여섯 갈래</text>

  <rect x="520" y="40" width="236" height="64" class="box"/>
  <text x="638" y="66" text-anchor="middle" class="name">OCI 플랫폼</text>
  <text x="638" y="86" text-anchor="middle" class="sub">테넌시 하나 · 서울 · compartment 8개</text>

  <path d="M174,72 L246,72" class="flow" marker-end="url(#o-ah)"/>
  <text x="178" y="64" class="edge-lbl">사양 역산</text>
  <path d="M442,72 L514,72" class="flow" marker-end="url(#o-ah)"/>
  <text x="452" y="64" class="edge-lbl">apply</text>

  <rect x="14" y="140" width="170" height="156" class="zone"/>
  <text x="20" y="134" class="coin">진실은 클러스터 밖에</text>

  <rect x="24" y="152" width="150" height="56" class="box"/>
  <text x="99" y="176" text-anchor="middle" class="name">Git 저장소</text>
  <text x="99" y="195" text-anchor="middle" class="sub">매니페스트와 values</text>

  <rect x="24" y="228" width="150" height="56" class="box"/>
  <text x="99" y="252" text-anchor="middle" class="name">OCI Vault</text>
  <text x="99" y="271" text-anchor="middle" class="sub">비밀값</text>

  <rect x="24" y="316" width="150" height="56" class="box"/>
  <text x="99" y="340" text-anchor="middle" class="name">이미지 레지스트리</text>
  <text x="99" y="359" text-anchor="middle" class="sub">ECR · OCIR</text>
  <text x="24" y="392" class="coin">토큰 자가 갱신</text>

  <rect x="228" y="132" width="528" height="252" class="zone"/>
  <text x="628" y="126" class="zone-lbl">dev OKE 클러스터</text>

  <text x="252" y="144" class="coin">values 두 장</text>
  <rect x="252" y="152" width="150" height="56" class="box"/>
  <text x="327" y="176" text-anchor="middle" class="name">ArgoCD</text>
  <text x="327" y="195" text-anchor="middle" class="sub">Application 66개</text>

  <rect x="252" y="228" width="150" height="56" class="box"/>
  <text x="327" y="252" text-anchor="middle" class="name">External Secrets</text>
  <text x="327" y="271" text-anchor="middle" class="sub">Secret으로 변환</text>

  <rect x="470" y="164" width="266" height="112" class="box"/>
  <text x="603" y="208" text-anchor="middle" class="name">서비스군 다섯</text>
  <text x="603" y="232" text-anchor="middle" class="plain">네임스페이스로 갈라 담음</text>

  <rect x="470" y="308" width="266" height="52" class="box"/>
  <text x="603" y="330" text-anchor="middle" class="plain">서비스군별 배치 Job</text>
  <text x="603" y="349" text-anchor="middle" class="sub">요청 경로와 분리</text>

  <path d="M638,104 L638,128" class="flow" marker-end="url(#o-ah)"/>
  <text x="646" y="120" class="edge-lbl">클러스터 생성</text>

  <path d="M174,180 L246,180" class="flow" marker-end="url(#o-ah)"/>
  <text x="180" y="172" class="edge-lbl">감시</text>
  <path d="M174,256 L246,256" class="flow" marker-end="url(#o-ah)"/>
  <text x="180" y="248" class="edge-lbl">조회</text>

  <path d="M402,176 L436,176 L436,196 L464,196" class="flow" marker-end="url(#o-ah)"/>
  <text x="408" y="168" class="edge-lbl">수동 sync</text>
  <path d="M402,260 L448,260 L448,236 L464,236" class="flow" marker-end="url(#o-ah)"/>
  <text x="404" y="278" class="edge-lbl">Secret 주입</text>

  <path d="M270,208 L270,218 L240,218 L240,334 L464,334" class="flow" marker-end="url(#o-ah)"/>
  <text x="298" y="328" class="edge-lbl">배치도 같은 경로로</text>

  <path d="M174,344 L430,344 L430,254 L464,254" class="flow-dot" marker-end="url(#o-ah)"/>
  <text x="182" y="360" class="edge-lbl">이미지 pull</text>
</svg>
