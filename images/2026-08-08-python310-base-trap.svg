<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 308" role="img" aria-label="같은 3.10 코드라도 base 이미지 태그를 범프했는지에 따라 결과가 갈린다. 범프하면 3.10 런타임 이미지가 되지만, 범프하지 않으면 3.7 base 위에 새 코드가 얹힌 이미지가 되고 빌드는 성공해서 드러나지 않는다">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: currentColor; }
    .name { font-size: 13px; font-weight: 600; }
    .plain { font-size: 13px; }
    .sub { font-size: 11px; opacity: .7; }
    .edge-lbl { font-size: 11px; opacity: .7; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.5; rx: 6; opacity: .55; }
    .box-bad { fill: none; stroke: #c24634; stroke-width: 1.8; rx: 6; }
    .bad-lbl { font-size: 11px; fill: #c24634; }
    .bad-txt { font-size: 13px; font-weight: 600; fill: #c24634; }
    .flow { stroke: currentColor; stroke-width: 1.6; fill: none; opacity: .6; }
    .flow-bad { stroke: #c24634; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="p-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
    <marker id="p-ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24634"/></marker>
  </defs>

  <rect x="20" y="106" width="170" height="60" class="box"/>
  <text x="105" y="130" text-anchor="middle" class="name">새 코드</text>
  <text x="105" y="150" text-anchor="middle" class="sub">Python ^3.10으로 선언</text>

  <rect x="270" y="106" width="200" height="60" class="box"/>
  <text x="370" y="130" text-anchor="middle" class="name">빌드 스크립트</text>
  <text x="370" y="150" text-anchor="middle" class="sub">태그에 적힌 base를 pull</text>

  <rect x="560" y="20" width="180" height="60" class="box"/>
  <text x="650" y="44" text-anchor="middle" class="plain">3.10 런타임 이미지</text>
  <text x="650" y="64" text-anchor="middle" class="sub">의도한 결과</text>

  <rect x="560" y="196" width="180" height="76" class="box-bad"/>
  <text x="650" y="220" text-anchor="middle" class="bad-txt">3.7 위에 새 코드</text>
  <text x="650" y="240" text-anchor="middle" class="sub">업그레이드가 조용히 무효</text>
  <text x="650" y="258" text-anchor="middle" class="bad-lbl">빌드는 성공 — 티가 안 남</text>

  <path d="M190,136 L264,136" class="flow" marker-end="url(#p-ah)"/>
  <path d="M470,120 L515,120 L515,50 L554,50" class="flow" marker-end="url(#p-ah)"/>
  <path d="M470,152 L515,152 L515,226 L554,226" class="flow-bad" marker-end="url(#p-ah-bad)"/>

  <text x="196" y="124" class="edge-lbl">빌드</text>
  <text x="480" y="98" class="edge-lbl">base 태그도 3.10으로 범프</text>
  <text x="480" y="186" class="bad-lbl">태그를 안 올림 (3.7 base)</text>
</svg>
