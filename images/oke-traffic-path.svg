<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" role="img" aria-label="OKE 클러스터 트래픽 경로: 사용자 요청이 로드밸런서와 Kong 게이트웨이를 거쳐 Keycloak 토큰 검증 후 5개 서비스군에 도달하고, 각 서비스군은 전용 Redis와 배치 Job을 함께 쓴다">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: currentColor; }
    .name { font-size: 13px; font-weight: 600; }
    .plain { font-size: 13px; }
    .sub { font-size: 11px; opacity: .7; }
    .mono { font-size: 10.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; opacity: .7; }
    .edge-lbl { font-size: 11px; opacity: .7; }
    .zone { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 4 3; rx: 8; opacity: .3; }
    .zone-lbl { font-size: 11px; font-weight: 600; opacity: .5; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.5; rx: 6; opacity: .55; }
    .box-kong { fill: none; stroke: #1f883d; stroke-width: 2; rx: 6; }
    .box-auth { fill: none; stroke: #9a6700; stroke-width: 1.6; rx: 6; }
    .box-data { fill: none; stroke: #0969da; stroke-width: 1.6; rx: 6; }
    .flow { stroke: currentColor; stroke-width: 1.6; fill: none; opacity: .6; }
    .flow-auth { stroke: #9a6700; stroke-width: 1.4; fill: none; }
    .flow-data { stroke: #0969da; stroke-width: 1.2; fill: none; stroke-dasharray: 3 2; opacity: .8; }
    .auth-lbl { font-size: 11px; fill: #9a6700; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
    <marker id="ah-auth" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/></marker>
  </defs>

  <ellipse cx="76" cy="38" rx="60" ry="22" class="box"/>
  <text x="76" y="35" text-anchor="middle" class="plain">사용자 요청</text>
  <text x="76" y="51" text-anchor="middle" class="sub">서비스별 도메인</text>

  <rect x="196" y="10" width="190" height="54" class="zone"/>
  <text x="206" y="6" class="zone-lbl">PUBLIC 10.0.0.0/24</text>
  <rect x="208" y="18" width="166" height="38" class="box"/>
  <text x="291" y="34" text-anchor="middle" class="plain">OCI Flexible LB</text>
  <text x="291" y="49" text-anchor="middle" class="sub">10~100 Mbps</text>

  <rect x="30" y="100" width="810" height="500" class="zone"/>
  <text x="40" y="95" class="zone-lbl">WORKER 10.0.10.0/24 — OKE 클러스터</text>

  <rect x="190" y="118" width="340" height="110" class="zone"/>
  <text x="200" y="134" class="zone-lbl">ns: kong</text>
  <rect x="204" y="143" width="148" height="72" class="box-kong"/>
  <text x="278" y="166" text-anchor="middle" class="name">Kong Proxy</text>
  <text x="278" y="184" text-anchor="middle" class="sub">커스텀 2.5.1</text>
  <text x="278" y="199" text-anchor="middle" class="sub">인증 플러그인 번들</text>
  <rect x="370" y="143" width="146" height="72" class="box"/>
  <text x="443" y="166" text-anchor="middle" class="name">Ingress Controller</text>
  <text x="443" y="186" text-anchor="middle" class="mono">ingressClass:</text>
  <text x="443" y="200" text-anchor="middle" class="mono">kong-likelion-dev</text>

  <rect x="580" y="143" width="130" height="72" class="box-auth"/>
  <text x="645" y="172" text-anchor="middle" class="name">Keycloak</text>
  <text x="645" y="191" text-anchor="middle" class="sub">토큰 발급·검증</text>

  <rect x="370" y="252" width="146" height="46" class="box"/>
  <text x="443" y="270" text-anchor="middle" class="plain">Ingress 매니페스트</text>
  <text x="443" y="287" text-anchor="middle" class="sub">서비스군별 host 규칙</text>

  <rect x="48" y="322" width="380" height="126" class="zone"/>
  <text x="58" y="338" class="zone-lbl">ns: likelion — 서비스 31종</text>
  <rect x="62" y="348" width="86" height="32" class="box"/><text x="105" y="369" text-anchor="middle" class="plain">course</text>
  <rect x="158" y="348" width="86" height="32" class="box"/><text x="201" y="369" text-anchor="middle" class="plain">auth</text>
  <rect x="254" y="348" width="160" height="32" class="box"/><text x="334" y="369" text-anchor="middle" class="plain">payment · message</text>
  <rect x="62" y="392" width="238" height="32" class="box"/><text x="181" y="413" text-anchor="middle" class="plain">permission · progress · media …</text>
  <rect x="310" y="392" width="104" height="32" class="box-data"/><text x="362" y="413" text-anchor="middle" class="plain">cronjob</text>

  <rect x="448" y="322" width="180" height="126" class="zone"/>
  <text x="458" y="338" class="zone-lbl">ns: ats — 7종</text>
  <rect x="460" y="348" width="156" height="32" class="box"/><text x="538" y="369" text-anchor="middle" class="plain">backoffice · home</text>
  <rect x="460" y="392" width="156" height="32" class="box-data"/><text x="538" y="413" text-anchor="middle" class="plain">ats-scheduler</text>

  <rect x="648" y="322" width="176" height="126" class="zone"/>
  <text x="658" y="338" class="zone-lbl">ns: saas — 8종</text>
  <rect x="660" y="348" width="152" height="32" class="box"/><text x="736" y="369" text-anchor="middle" class="plain">admin · front</text>
  <rect x="660" y="392" width="152" height="32" class="box-data"/><text x="736" y="413" text-anchor="middle" class="plain">saas-admin-job</text>

  <rect x="448" y="464" width="376" height="120" class="zone"/>
  <text x="458" y="480" class="zone-lbl">ns: lionhub — 7종 · ns: campfire — 8종</text>
  <rect x="460" y="490" width="176" height="32" class="box"/><text x="548" y="511" text-anchor="middle" class="plain">community · backoffice</text>
  <rect x="648" y="490" width="164" height="32" class="box"/><text x="730" y="511" text-anchor="middle" class="plain">livekit · api · web</text>
  <rect x="460" y="534" width="176" height="32" class="box-data"/><text x="548" y="555" text-anchor="middle" class="plain">lionhub-job</text>
  <rect x="648" y="534" width="164" height="32" class="box-data"/><text x="730" y="555" text-anchor="middle" class="plain">campfire-redis</text>

  <rect x="48" y="464" width="376" height="120" class="zone"/>
  <text x="58" y="480" class="zone-lbl">캐시 — Bitnami Redis 7.4</text>
  <rect x="62" y="490" width="110" height="40" class="box-data"/><text x="117" y="509" text-anchor="middle" class="plain">likelion</text><text x="117" y="524" text-anchor="middle" class="sub">-cache</text>
  <rect x="184" y="490" width="110" height="40" class="box-data"/><text x="239" y="509" text-anchor="middle" class="plain">ats</text><text x="239" y="524" text-anchor="middle" class="sub">-cache</text>
  <rect x="306" y="490" width="106" height="40" class="box-data"/><text x="359" y="509" text-anchor="middle" class="plain">saas</text><text x="359" y="524" text-anchor="middle" class="sub">-cache</text>
  <text x="62" y="556" class="sub">서비스군마다 전용 — 한쪽 장애가 다른 군으로 번지지 않게</text>

  <path d="M138,38 L202,38" class="flow" marker-end="url(#ah)"/>
  <path d="M291,64 L291,137" class="flow" marker-end="url(#ah)"/>
  <path d="M370,180 L358,180" class="flow" marker-end="url(#ah)"/>
  <path d="M443,252 L443,222" class="flow" marker-end="url(#ah)"/>
  <path d="M278,143 L278,128 L645,128 L645,139" class="flow-auth" marker-end="url(#ah-auth)"/>
  <path d="M660,215 L660,232 L292,232 L292,219" class="flow-auth" marker-end="url(#ah-auth)" stroke-dasharray="4 3"/>
  <path d="M278,215 L278,310 L200,310 L200,344" class="flow" marker-end="url(#ah)"/>
  <path d="M278,310 L538,310 L538,344" class="flow" marker-end="url(#ah)"/>
  <path d="M538,310 L736,310 L736,344" class="flow" marker-end="url(#ah)"/>
  <path d="M736,310 L840,310 L840,476 L812,476" class="flow" marker-end="url(#ah)"/>
  <path d="M117,490 L117,456 L160,456 L160,428" class="flow-data"/>
  <path d="M239,490 L239,468 L470,468 L470,430" class="flow-data"/>
  <path d="M359,490 L359,476 L760,476 L760,430" class="flow-data"/>

  <text x="146" y="30" class="edge-lbl">HTTPS</text>
  <text x="299" y="108" class="edge-lbl">요청 전달</text>
  <text x="455" y="240" class="edge-lbl">host 규칙 읽음</text>
  <text x="366" y="196" class="edge-lbl">Kong 설정 반영</text>
  <text x="440" y="122" class="auth-lbl">토큰 검증 요청</text>
  <text x="440" y="246" class="auth-lbl">검증 결과</text>
  <text x="60" y="304" class="edge-lbl">인증 통과 후 서비스군별 라우팅</text>
  <text x="640" y="604" class="edge-lbl">파란 테두리 = 캐시·배치 Job (요청 경로 밖)</text>
</svg>
