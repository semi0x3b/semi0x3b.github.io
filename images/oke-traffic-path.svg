<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 632" role="img" aria-label="OKE 클러스터 구성: 사용자 요청이 로드밸런서와 Kong 게이트웨이를 거쳐 4개 서비스군에 도달하고, 각 서비스군은 Redis와 배치 Job을 함께 사용하는 구조">
  <style>
    .lbl { font: 13px system-ui, -apple-system, sans-serif; fill: #24292f; }
    .lbl-sm { font: 11px system-ui, -apple-system, sans-serif; fill: #57606a; }
    .lbl-mono { font: 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #57606a; }
    .title { font: 600 13px system-ui, -apple-system, sans-serif; fill: #24292f; }
    .zone { fill: none; stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 4 3; rx: 8; }
    .zone-lbl { font: 600 11px system-ui, sans-serif; fill: #8c959f; letter-spacing: .03em; }
    .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; rx: 6; }
    .box-kong { fill: #ffffff; stroke: #1f883d; stroke-width: 2; rx: 6; }
    .box-auth { fill: #ffffff; stroke: #9a6700; stroke-width: 1.5; rx: 6; }
    .box-data { fill: #ffffff; stroke: #0969da; stroke-width: 1.5; rx: 6; }
    .flow { stroke: #656d76; stroke-width: 1.8; fill: none; marker-end: url(#ah); }
    .flow-cfg { stroke: #8250df; stroke-width: 1.4; fill: none; stroke-dasharray: 5 3; marker-end: url(#ah-cfg); }
    .flow-auth { stroke: #9a6700; stroke-width: 1.4; fill: none; marker-end: url(#ah-auth); }
    .flow-data { stroke: #0969da; stroke-width: 1.3; fill: none; stroke-dasharray: 3 2; }
    @media (prefers-color-scheme: dark) {
      .lbl, .title { fill: #e6edf3; }
      .lbl-sm, .lbl-mono { fill: #8b949e; }
      .zone { stroke: #30363d; } .zone-lbl { fill: #6e7681; }
      .box { fill: #0d1117; stroke: #30363d; }
      .box-kong { fill: #0d1117; stroke: #3fb950; }
      .box-auth { fill: #0d1117; stroke: #d29922; }
      .box-data { fill: #0d1117; stroke: #58a6ff; }
      .flow { stroke: #8b949e; }
    }
    :root[data-theme="dark"] .lbl, :root[data-theme="dark"] .title { fill: #e6edf3; }
    :root[data-theme="dark"] .lbl-sm, :root[data-theme="dark"] .lbl-mono { fill: #8b949e; }
    :root[data-theme="dark"] .zone { stroke: #30363d; }
    :root[data-theme="dark"] .zone-lbl { fill: #6e7681; }
    :root[data-theme="dark"] .box { fill: #0d1117; stroke: #30363d; }
    :root[data-theme="dark"] .box-kong { fill: #0d1117; stroke: #3fb950; }
    :root[data-theme="dark"] .box-auth { fill: #0d1117; stroke: #d29922; }
    :root[data-theme="dark"] .box-data { fill: #0d1117; stroke: #58a6ff; }
    :root[data-theme="dark"] .flow { stroke: #8b949e; }
    :root[data-theme="light"] .lbl, :root[data-theme="light"] .title { fill: #24292f; }
    :root[data-theme="light"] .box { fill: #ffffff; stroke: #d0d7de; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#656d76"/></marker>
    <marker id="ah-cfg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker>
    <marker id="ah-auth" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/></marker>
  </defs>

  <ellipse cx="76" cy="38" rx="62" ry="23" class="box"/>
  <text x="76" y="35" text-anchor="middle" class="lbl">사용자 요청</text>
  <text x="76" y="50" text-anchor="middle" class="lbl-mono">*.projectlion.io</text>

  <rect x="196" y="10" width="190" height="56" class="zone"/>
  <text x="206" y="6" class="zone-lbl">PUBLIC 10.0.0.0/24</text>
  <rect x="208" y="18" width="166" height="40" class="box"/>
  <text x="291" y="35" text-anchor="middle" class="lbl">OCI Flexible LB</text>
  <text x="291" y="50" text-anchor="middle" class="lbl-sm">10~100 Mbps</text>

  <rect x="30" y="100" width="810" height="505" class="zone"/>
  <text x="40" y="95" class="zone-lbl">WORKER 10.0.10.0/24 — OKE 클러스터</text>

  <rect x="190" y="118" width="340" height="112" class="zone"/>
  <text x="200" y="134" class="zone-lbl">ns: kong</text>
  <rect x="204" y="143" width="148" height="74" class="box-kong"/>
  <text x="278" y="166" text-anchor="middle" class="title">Kong Proxy</text>
  <text x="278" y="184" text-anchor="middle" class="lbl-sm">커스텀 2.5.1</text>
  <text x="278" y="199" text-anchor="middle" class="lbl-sm">인증 플러그인 번들</text>
  <rect x="370" y="143" width="146" height="74" class="box"/>
  <text x="443" y="166" text-anchor="middle" class="title">Ingress Controller</text>
  <text x="443" y="186" text-anchor="middle" class="lbl-mono">ingressClass:</text>
  <text x="443" y="200" text-anchor="middle" class="lbl-mono">kong-likelion-dev</text>

  <rect x="580" y="143" width="130" height="74" class="box-auth"/>
  <text x="645" y="172" text-anchor="middle" class="title">Keycloak</text>
  <text x="645" y="191" text-anchor="middle" class="lbl-sm">토큰 발급·검증</text>

  <rect x="370" y="252" width="146" height="48" class="box"/>
  <text x="443" y="271" text-anchor="middle" class="lbl">Ingress 매니페스트</text>
  <text x="443" y="288" text-anchor="middle" class="lbl-sm">서비스군별 host 규칙</text>

  <!-- 서비스군 4개 -->
  <rect x="48" y="322" width="380" height="128" class="zone"/>
  <text x="58" y="338" class="zone-lbl">ns: likelion — 서비스 31종</text>
  <rect x="62" y="348" width="86" height="34" class="box"/><text x="105" y="370" text-anchor="middle" class="lbl">course</text>
  <rect x="158" y="348" width="86" height="34" class="box"/><text x="201" y="370" text-anchor="middle" class="lbl">auth</text>
  <rect x="254" y="348" width="160" height="34" class="box"/><text x="334" y="370" text-anchor="middle" class="lbl">payment · message</text>
  <rect x="62" y="392" width="238" height="34" class="box"/><text x="181" y="414" text-anchor="middle" class="lbl">permission · progress · media …</text>
  <rect x="310" y="392" width="104" height="34" class="box-data"/><text x="362" y="414" text-anchor="middle" class="lbl">cronjob</text>

  <rect x="448" y="322" width="180" height="128" class="zone"/>
  <text x="458" y="338" class="zone-lbl">ns: ats — 7종</text>
  <rect x="460" y="348" width="156" height="34" class="box"/><text x="538" y="370" text-anchor="middle" class="lbl">backoffice · home</text>
  <rect x="460" y="392" width="156" height="34" class="box-data"/><text x="538" y="414" text-anchor="middle" class="lbl">ats-scheduler</text>

  <rect x="648" y="322" width="176" height="128" class="zone"/>
  <text x="658" y="338" class="zone-lbl">ns: saas — 8종</text>
  <rect x="660" y="348" width="152" height="34" class="box"/><text x="736" y="370" text-anchor="middle" class="lbl">admin · front</text>
  <rect x="660" y="392" width="152" height="34" class="box-data"/><text x="736" y="414" text-anchor="middle" class="lbl">saas-admin-job</text>

  <rect x="448" y="466" width="376" height="122" class="zone"/>
  <text x="458" y="482" class="zone-lbl">ns: lionhub — 7종 · ns: campfire — 8종</text>
  <rect x="460" y="492" width="176" height="34" class="box"/><text x="548" y="514" text-anchor="middle" class="lbl">community · backoffice</text>
  <rect x="648" y="492" width="164" height="34" class="box"/><text x="730" y="514" text-anchor="middle" class="lbl">livekit · api · web</text>
  <rect x="460" y="536" width="176" height="34" class="box-data"/><text x="548" y="558" text-anchor="middle" class="lbl">lionhub-job</text>
  <rect x="648" y="536" width="164" height="34" class="box-data"/><text x="730" y="558" text-anchor="middle" class="lbl">campfire-redis · pgbouncer</text>

  <!-- Redis (공유 캐시) -->
  <rect x="48" y="466" width="376" height="122" class="zone"/>
  <text x="58" y="482" class="zone-lbl">캐시 — Bitnami Redis 7.4 차트</text>
  <rect x="62" y="492" width="110" height="42" class="box-data"/><text x="117" y="512" text-anchor="middle" class="lbl">likelion</text><text x="117" y="527" text-anchor="middle" class="lbl-sm">-cache</text>
  <rect x="184" y="492" width="110" height="42" class="box-data"/><text x="239" y="512" text-anchor="middle" class="lbl">ats</text><text x="239" y="527" text-anchor="middle" class="lbl-sm">-cache</text>
  <rect x="306" y="492" width="106" height="42" class="box-data"/><text x="359" y="512" text-anchor="middle" class="lbl">saas</text><text x="359" y="527" text-anchor="middle" class="lbl-sm">-cache</text>
  <text x="62" y="562" class="lbl-sm">서비스군마다 전용 — 한쪽 장애가 다른 군으로 번지지 않게</text>

  <path d="M140,38 L202,38" class="flow"/>
  <path d="M291,66 L291,137" class="flow"/>
  <path d="M370,180 L358,180" class="flow-cfg"/>
  <path d="M443,252 L443,224" class="flow-cfg"/>
  <path d="M352,168 L574,168" class="flow-auth"/>
  <path d="M574,196 L352,196" class="flow-auth" stroke-dasharray="4 3"/>
  <path d="M262,222 L200,344" class="flow"/>
  <path d="M330,225 L520,344" class="flow"/>
  <path d="M345,224 L720,344" class="flow"/>
  <path d="M300,230 L540,488" class="flow"/>

  <path d="M117,492 L150,428" class="flow-data"/>
  <path d="M239,492 L520,428" class="flow-data"/>
  <path d="M359,496 L720,428" class="flow-data"/>

  <text x="305" y="108" class="lbl-sm">요청</text>
  <text x="455" y="240" text-anchor="middle" class="lbl-sm" fill="#8250df">읽어서 Kong 설정 반영</text>
  <text x="463" y="162" text-anchor="middle" class="lbl-sm" fill="#9a6700">토큰 검증</text>
  <text x="463" y="213" text-anchor="middle" class="lbl-sm" fill="#9a6700">결과</text>
  <text x="150" y="300" class="lbl-sm">인증 통과 후 서비스군별 라우팅</text>

  <rect x="640" y="600" width="14" height="10" class="box-data"/>
  <text x="660" y="609" class="lbl-sm">파란 테두리 = 캐시·배치 Job (요청 경로 밖)</text>
</svg>
