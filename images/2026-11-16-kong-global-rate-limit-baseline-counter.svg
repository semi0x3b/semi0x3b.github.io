<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 410" role="img" aria-label="ip-restriction은 PRIORITY 990으로 rate-limiting(901)보다 먼저 실행된다. ip-restriction이 403으로 끝낸 요청과, 일치하는 route가 없어 404로 끝난 요청은 호출 제한 카운터에 들어가지 않는다(404는 로컬 시험 결과). 나머지 요청은 그 route에 rate-limiting 설정이 있으면 route 카운터에, 없으면 전역 카운터에 들어간다. 전역 카운터는 자기 설정이 없는 route들로 한 IP가 보낸 요청을 호스트와 route를 가리지 않고 합쳐 센다. 두 카운터 모두 Kong 파드마다, 분 단위로 따로 돈다." font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="420" height="410" fill="#FDFCFA"/>

  <!-- 요청 -->
  <rect x="110" y="16" width="200" height="36" rx="4" fill="#FDFCFA" stroke="#2b2b2b"/>
  <text x="210" y="39" font-size="13" font-weight="600" fill="#2b2b2b" text-anchor="middle">요청 (클라이언트 IP)</text>

  <line x1="210" y1="52" x2="210" y2="82" stroke="#2b2b2b" marker-end="url(#ah)"/>
  <text x="218" y="72" font-size="12" fill="#2b2b2b" fill-opacity=".7">Kong이 처리 시작</text>

  <!-- 카운터에 안 세는 요청인가 -->
  <rect x="16" y="84" width="260" height="88" rx="4" fill="#FDFCFA" stroke="#2b2b2b"/>
  <text x="28" y="104" font-size="13" font-weight="600" fill="#2b2b2b">카운터에 안 세는 요청인가</text>
  <text x="28" y="123" font-size="12" fill="#2b2b2b" fill-opacity=".7">ip-restriction(990)이 낸 403</text>
  <text x="40" y="141" font-size="12" fill="#2b2b2b" fill-opacity=".5">rate-limiting(901)보다 먼저 끝남</text>
  <text x="28" y="159" font-size="12" fill="#2b2b2b" fill-opacity=".7">일치 route 없는 404 (로컬 시험)</text>

  <line x1="276" y1="128" x2="298" y2="128" stroke="#e8590c" marker-end="url(#ah)"/>
  <text x="287" y="120" font-size="12" font-weight="600" fill="#e8590c" text-anchor="middle">예</text>

  <rect x="300" y="103" width="104" height="50" rx="4" fill="#e8590c" fill-opacity=".08" stroke="#e8590c" stroke-width="1.5"/>
  <text x="312" y="123" font-size="13" font-weight="600" fill="#e8590c">카운터에</text>
  <text x="312" y="142" font-size="13" font-weight="600" fill="#e8590c">안 들어감</text>

  <line x1="141" y1="172" x2="141" y2="206" stroke="#2b2b2b" marker-end="url(#ah)"/>
  <text x="149" y="194" font-size="12" fill="#2b2b2b" fill-opacity=".7">아니오</text>

  <!-- route 설정 -->
  <rect x="16" y="208" width="388" height="40" rx="4" fill="#FDFCFA" stroke="#2b2b2b"/>
  <text x="28" y="233" font-size="13" font-weight="600" fill="#2b2b2b">그 route에 rate-limiting 설정이 있나</text>

  <line x1="110" y1="248" x2="110" y2="286" stroke="#2b2b2b" marker-end="url(#ah)"/>
  <text x="118" y="272" font-size="12" fill="#2b2b2b" fill-opacity=".7">아니오</text>
  <line x1="310" y1="248" x2="310" y2="286" stroke="#2b2b2b" marker-end="url(#ah)"/>
  <text x="318" y="272" font-size="12" fill="#2b2b2b" fill-opacity=".7">예</text>

  <!-- 카운터 두 개 -->
  <rect x="16" y="288" width="186" height="104" rx="4" fill="#FDFCFA" stroke="#2b2b2b"/>
  <text x="28" y="310" font-size="13" font-weight="600" fill="#2b2b2b">전역 카운터</text>
  <text x="28" y="330" font-size="12" fill="#2b2b2b" fill-opacity=".7">파드, IP, 분마다</text>
  <text x="28" y="348" font-size="12" fill="#2b2b2b" fill-opacity=".7">route를 가리지 않고 합쳐 셈</text>
  <text x="28" y="374" font-size="12" fill="#2b2b2b" fill-opacity=".5">예: 화면, API 요청</text>

  <rect x="218" y="288" width="186" height="104" rx="4" fill="#FDFCFA" stroke="#2b2b2b"/>
  <text x="230" y="310" font-size="13" font-weight="600" fill="#2b2b2b">route 카운터</text>
  <text x="230" y="330" font-size="12" fill="#2b2b2b" fill-opacity=".7">파드, route, IP, 분마다</text>
  <text x="230" y="348" font-size="12" fill="#2b2b2b" fill-opacity=".7">그 route 요청만 셈</text>
  <text x="230" y="374" font-size="12" fill="#2b2b2b" fill-opacity=".5">예: favicon 경로</text>
</svg>
