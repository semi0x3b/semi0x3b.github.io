<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 800" role="img" aria-label="관리자가 엑셀 다운로드를 누른 뒤 파일이 손에 들어오기까지 서버가 거치는 순서. 사유와 항목을 검증하고, 서버가 직접 마스킹 여부를 판정하고, 중앙 기록소에 기록이 남아야만 다음 단계로 넘어간다. 이어 화면과 같은 필터로 조회해 구 CSV 양식대로 행을 조립하고, 셀 단일 방어선에서 값을 정제한 뒤 암호와 일련번호를 걸어 내려준다">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: currentColor; }
    .name { font-size: 13px; font-weight: 600; }
    .plain { font-size: 13px; }
    .sub { font-size: 11px; opacity: .7; }
    .edge-lbl { font-size: 11px; opacity: .7; }
    .zone { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 4 3; rx: 8; opacity: .3; }
    .zone-lbl { font-size: 11px; font-weight: 600; opacity: .5; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.5; rx: 6; opacity: .55; }
    .box-stop { fill: none; stroke: #c24634; stroke-width: 1.8; rx: 6; }
    .flow { stroke: currentColor; stroke-width: 1.6; fill: none; opacity: .6; }
    .flow-stop { stroke: #c24634; stroke-width: 1.6; fill: none; }
    .stop-lbl { font-size: 11px; fill: #c24634; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
    <marker id="ah-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24634"/></marker>
  </defs>

  <rect x="100" y="20" width="300" height="52" class="box"/>
  <text x="250" y="42" text-anchor="middle" class="name">관리자 화면</text>
  <text x="250" y="60" text-anchor="middle" class="sub">조건을 걸어 목록을 좁혀 본 상태</text>

  <rect x="100" y="106" width="300" height="56" class="box"/>
  <text x="250" y="128" text-anchor="middle" class="name">다운로드 창</text>
  <text x="250" y="146" text-anchor="middle" class="sub">사유 · 받을 항목 · 파일 암호를 입력</text>

  <rect x="60" y="200" width="660" height="470" class="zone"/>
  <text x="72" y="192" class="zone-lbl">서버</text>

  <rect x="100" y="224" width="300" height="44" class="box"/>
  <text x="250" y="251" text-anchor="middle" class="plain">사유와 항목 검증</text>

  <rect x="100" y="296" width="300" height="44" class="box"/>
  <text x="250" y="323" text-anchor="middle" class="name">서버 판정</text>

  <rect x="100" y="368" width="300" height="44" class="box-stop"/>
  <text x="250" y="395" text-anchor="middle" class="name">중앙 기록소에 기록</text>

  <rect x="100" y="440" width="300" height="56" class="box"/>
  <text x="250" y="462" text-anchor="middle" class="name">조회와 행 조립</text>
  <text x="250" y="480" text-anchor="middle" class="sub">양식 3층위 — 라벨 · 순서 · 값 포맷</text>

  <rect x="100" y="524" width="300" height="56" class="box"/>
  <text x="250" y="546" text-anchor="middle" class="name">셀 단일 방어선</text>
  <text x="250" y="564" text-anchor="middle" class="sub">제어문자 제거 · 수식 무력화</text>

  <rect x="100" y="608" width="300" height="44" class="box"/>
  <text x="250" y="635" text-anchor="middle" class="plain">암호로 잠그고 일련번호 각인</text>

  <rect x="460" y="296" width="220" height="44" class="box"/>
  <text x="570" y="323" text-anchor="middle" class="plain">권한 시스템</text>

  <rect x="460" y="368" width="220" height="44" class="box"/>
  <text x="570" y="395" text-anchor="middle" class="plain">중앙 기록소</text>

  <rect x="100" y="704" width="300" height="52" class="box"/>
  <text x="250" y="726" text-anchor="middle" class="name">내려받은 파일</text>
  <text x="250" y="744" text-anchor="middle" class="sub">열 때 암호를 묻고 속성에 일련번호</text>

  <path d="M250,72 L250,100" class="flow" marker-end="url(#ah)"/>
  <path d="M250,162 L250,218" class="flow" marker-end="url(#ah)"/>
  <path d="M250,268 L250,290" class="flow" marker-end="url(#ah)"/>
  <path d="M250,340 L250,362" class="flow" marker-end="url(#ah)"/>
  <path d="M250,412 L250,434" class="flow-stop" marker-end="url(#ah-stop)"/>
  <path d="M250,496 L250,518" class="flow" marker-end="url(#ah)"/>
  <path d="M250,580 L250,602" class="flow" marker-end="url(#ah)"/>
  <path d="M250,652 L250,698" class="flow" marker-end="url(#ah)"/>

  <path d="M400,312 L454,312" class="flow" marker-end="url(#ah)"/>
  <path d="M454,328 L400,328" class="flow" marker-end="url(#ah)"/>
  <path d="M400,390 L454,390" class="flow-stop" marker-end="url(#ah-stop)"/>

  <text x="260" y="92" class="edge-lbl">받기를 누름</text>
  <text x="260" y="186" class="edge-lbl">입력값을 함께 보냄</text>
  <text x="260" y="284" class="edge-lbl">통과한 요청만</text>
  <text x="260" y="356" class="edge-lbl">가릴지 말지를 정하고</text>
  <text x="260" y="428" class="stop-lbl">기록이 남은 뒤에만</text>
  <text x="260" y="512" class="edge-lbl">화면과 같은 필터로 받은 행</text>
  <text x="260" y="596" class="edge-lbl">정제를 마친 값</text>
  <text x="260" y="682" class="edge-lbl">잠긴 파일을 응답으로</text>

  <text x="404" y="306" class="edge-lbl">권한을 물어봄</text>
  <text x="404" y="348" class="edge-lbl">최고관리자인지 답</text>
  <text x="404" y="384" class="stop-lbl">기록 요청</text>
</svg>
