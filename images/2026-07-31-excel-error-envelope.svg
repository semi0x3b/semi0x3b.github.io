<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img" aria-label="엑셀 코드가 에러 코드 없이 메시지만 담아 잘못된 요청 예외를 던지면, 400 응답을 조립하는 처리기가 필수 항목이 빠진 값으로 응답을 만들다 실패하고 그 실패가 다시 위로 던져져 422가 나간다. 스키마가 받지 않는 최상위 키에 둔 부가 정보도 함께 버려진다">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: currentColor; }
    .name { font-size: 13px; font-weight: 600; }
    .plain { font-size: 13px; }
    .sub { font-size: 11px; opacity: .7; }
    .edge-lbl { font-size: 11px; opacity: .7; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.5; rx: 6; opacity: .55; }
    .box-bad { fill: none; stroke: #c24634; stroke-width: 1.8; rx: 6; }
    .flow { stroke: currentColor; stroke-width: 1.6; fill: none; opacity: .6; }
    .flow-bad { stroke: #c24634; stroke-width: 1.6; fill: none; }
    .bad-lbl { font-size: 11px; fill: #c24634; }
    .bad-name { font-size: 13px; font-weight: 600; fill: #c24634; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
    <marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24634"/></marker>
  </defs>

  <rect x="60" y="20" width="380" height="62" class="box"/>
  <text x="250" y="45" text-anchor="middle" class="name">엑셀 코드가 잘못된 요청 예외를 던져요</text>
  <text x="250" y="66" text-anchor="middle" class="sub">메시지만 담고 에러 코드 자리는 비워둔 채로</text>

  <rect x="60" y="150" width="380" height="62" class="box"/>
  <text x="250" y="175" text-anchor="middle" class="name">400 처리기가 응답 스키마에 값을 부어요</text>
  <text x="250" y="196" text-anchor="middle" class="sub">스키마는 에러 코드를 필수로 요구해요</text>

  <rect x="60" y="280" width="380" height="62" class="box-bad"/>
  <text x="250" y="305" text-anchor="middle" class="bad-name">조립하다 그 자리에서 예외가 나요</text>
  <text x="250" y="326" text-anchor="middle" class="sub">400을 만들던 코드가 400을 못 만들었어요</text>

  <rect x="60" y="410" width="380" height="62" class="box-bad"/>
  <text x="250" y="435" text-anchor="middle" class="bad-name">422가 나가요</text>
  <text x="250" y="456" text-anchor="middle" class="sub">응답 데이터 검증에 실패했습니다</text>

  <rect x="560" y="150" width="210" height="84" class="box-bad"/>
  <text x="665" y="176" text-anchor="middle" class="bad-name">스키마 밖 값은 버려져요</text>
  <text x="665" y="198" text-anchor="middle" class="sub">고를 수 있는 항목과</text>
  <text x="665" y="216" text-anchor="middle" class="sub">잘못 넘어온 항목</text>

  <path d="M250,82 L250,144" class="flow" marker-end="url(#ah)"/>
  <path d="M250,212 L250,274" class="flow-bad" marker-end="url(#ah-bad)"/>
  <path d="M250,342 L250,404" class="flow-bad" marker-end="url(#ah-bad)"/>
  <path d="M442,181 L500,181 L500,192 L554,192" class="flow-bad" marker-end="url(#ah-bad)"/>

  <text x="260" y="117" class="edge-lbl">이 값을 그대로 넘겨받아</text>
  <text x="260" y="247" class="bad-lbl">필수 항목이 비어 있어서</text>
  <text x="260" y="377" class="bad-lbl">실패가 다시 위로 던져져</text>
  <text x="450" y="172" class="bad-lbl">스키마가 안 받는 자리라</text>
</svg>
