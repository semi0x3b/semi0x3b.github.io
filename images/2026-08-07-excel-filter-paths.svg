<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-label="같은 관리자 화면에서 출발한 목록 조회와 엑셀 다운로드가 서로 다른 경로를 타는 구조. 목록 조회는 필터를 조건 생성기까지 전달하지만, 엑셀 경로는 라우터·유스케이스·조회 함수 세 지점 중 한 곳에서 필터를 잃고 전체 행을 반환한다">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: currentColor; }
    .name { font-size: 13px; font-weight: 600; }
    .plain { font-size: 13px; }
    .sub { font-size: 11px; opacity: .7; }
    .mono { font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; opacity: .7; }
    .edge-lbl { font-size: 11px; opacity: .7; }
    .zone { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 4 3; rx: 8; opacity: .3; }
    .zone-lbl { font-size: 11px; font-weight: 600; opacity: .5; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.5; rx: 6; opacity: .55; }
    .box-lost { fill: none; stroke: #cf222e; stroke-width: 1.8; rx: 6; }
    .flow { stroke: currentColor; stroke-width: 1.6; fill: none; opacity: .6; }
    .flow-lost { stroke: #cf222e; stroke-width: 1.6; fill: none; }
    .lost-lbl { font-size: 11px; fill: #cf222e; }
    .lost-num { font-size: 13px; font-weight: 700; fill: #cf222e; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
    <marker id="ah-lost" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
  </defs>

  <rect x="300" y="20" width="220" height="52" class="box"/>
  <text x="410" y="42" text-anchor="middle" class="name">관리자 화면</text>
  <text x="410" y="60" text-anchor="middle" class="sub">과정·상태·검색어로 걸러 본 목록</text>

  <rect x="40" y="130" width="330" height="290" class="zone"/>
  <text x="52" y="122" class="zone-lbl">목록 조회 — 화면에 보이는 행</text>

  <rect x="60" y="146" width="290" height="44" class="box"/>
  <text x="205" y="173" text-anchor="middle" class="plain">목록 라우터</text>

  <rect x="60" y="234" width="290" height="44" class="box"/>
  <text x="205" y="261" text-anchor="middle" class="plain">목록 유스케이스</text>

  <rect x="60" y="322" width="290" height="60" class="box"/>
  <text x="205" y="347" text-anchor="middle" class="name">조건 생성기</text>
  <text x="205" y="366" text-anchor="middle" class="sub">필터를 조회 조건으로 옮기는 한 곳</text>

  <rect x="450" y="130" width="330" height="290" class="zone"/>
  <text x="462" y="122" class="zone-lbl">엑셀 다운로드 — 파일에 담기는 행</text>

  <rect x="470" y="146" width="290" height="44" class="box-lost"/>
  <text x="606" y="173" text-anchor="middle" class="plain">엑셀 라우터</text>
  <text x="484" y="173" class="lost-num">1</text>

  <rect x="470" y="234" width="290" height="44" class="box-lost"/>
  <text x="606" y="261" text-anchor="middle" class="plain">엑셀 유스케이스</text>
  <text x="484" y="261" class="lost-num">2</text>

  <rect x="470" y="322" width="290" height="60" class="box-lost"/>
  <text x="606" y="347" text-anchor="middle" class="plain">엑셀 전용 조회 함수</text>
  <text x="606" y="366" text-anchor="middle" class="sub">해석 코드를 따로 들고 있음</text>
  <text x="484" y="347" class="lost-num">3</text>

  <path d="M340,72 L205,72 L205,140" class="flow" marker-end="url(#ah)"/>
  <path d="M480,72 L606,72 L606,140" class="flow-lost" marker-end="url(#ah-lost)"/>
  <path d="M205,190 L205,228" class="flow" marker-end="url(#ah)"/>
  <path d="M205,278 L205,316" class="flow" marker-end="url(#ah)"/>
  <path d="M606,190 L606,228" class="flow-lost" marker-end="url(#ah-lost)"/>
  <path d="M606,278 L606,316" class="flow-lost" marker-end="url(#ah-lost)"/>

  <rect x="60" y="416" width="290" height="34" class="box"/>
  <text x="205" y="438" text-anchor="middle" class="plain">걸러진 행</text>
  <rect x="470" y="416" width="290" height="34" class="box-lost"/>
  <text x="606" y="438" text-anchor="middle" class="plain">전체 행</text>

  <path d="M205,382 L205,410" class="flow" marker-end="url(#ah)"/>
  <path d="M606,382 L606,410" class="flow-lost" marker-end="url(#ah-lost)"/>

  <text x="214" y="100" class="edge-lbl">같은 필터를 그대로 전달</text>
  <text x="616" y="100" class="lost-lbl">같은 필터를 함께 보냄</text>
  <text x="214" y="216" class="edge-lbl">필터 유지</text>
  <text x="214" y="304" class="edge-lbl">필터 유지</text>
  <text x="616" y="216" class="lost-lbl">1 받을 자리가 없음</text>
  <text x="616" y="304" class="lost-lbl">2 빈 값으로 덮음</text>
  <text x="616" y="400" class="lost-lbl">3 기관 코드만 옮기고 나머지는 버림</text>
</svg>
