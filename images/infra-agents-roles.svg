<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 400" role="img" aria-label="메인 세션이 요청을 환경·도메인별 전문 에이전트에 넘기고, 전문 에이전트의 완료 보고는 읽기 전용 검수자가 완료 조건과 대조한 뒤 메인 세션으로 돌아온다" style="max-width:420px;width:100%;height:auto">
  <rect x="0" y="0" width="420" height="400" rx="8" fill="#FDFCFA"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/>
    </marker>
    <marker id="ar-x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/>
    </marker>
  </defs>

  <g fill="none" stroke="#2b2b2b" stroke-width="1.5">
    <rect x="110" y="20" width="200" height="48" rx="6"/>
    <rect x="70" y="108" width="280" height="150" rx="8" stroke-dasharray="5 4" opacity=".5"/>
    <rect x="90" y="132" width="240" height="26" rx="5"/>
    <rect x="90" y="164" width="240" height="26" rx="5"/>
    <rect x="90" y="196" width="240" height="26" rx="5"/>
    <rect x="90" y="228" width="240" height="26" rx="5"/>
  </g>
  <rect x="110" y="308" width="200" height="48" rx="6" fill="none" stroke="#e8590c" stroke-width="1.5"/>

  <g font-size="14" text-anchor="middle" fill="#2b2b2b">
    <text x="210" y="40" font-weight="600">메인 세션</text>
    <text x="210" y="58" font-size="12" opacity=".7">요청 분배, 최종 판단</text>
    <text x="210" y="124" font-size="12" opacity=".7">전문 에이전트 8개</text>
    <text x="210" y="150" font-size="13">환경별 3 (dev, stg, prod)</text>
    <text x="210" y="182" font-size="13">서비스별 3 (채용, LMS, 커뮤니티)</text>
    <text x="210" y="214" font-size="13">배포 도구 1 (릴리스 이관)</text>
    <text x="210" y="246" font-size="13">클라우드 권한 1 (IAM)</text>
    <text x="210" y="328" font-weight="600" fill="#e8590c">검수자</text>
    <text x="210" y="346" font-size="12" opacity=".7">읽기 전용</text>
  </g>

  <g stroke="#2b2b2b" stroke-width="1.5" fill="none">
    <line x1="210" y1="68" x2="210" y2="106" marker-end="url(#ar)"/>
    <line x1="210" y1="258" x2="210" y2="306" marker-end="url(#ar)"/>
  </g>
  <path d="M310 332 L390 332 L390 44 L312 44" stroke="#e8590c" stroke-width="1.5" fill="none" marker-end="url(#ar-x)"/>

  <g font-size="12" fill="#2b2b2b">
    <text x="218" y="92">요청 위임</text>
    <text x="218" y="288">"완료" 보고</text>
    <text x="396" y="200" fill="#e8590c" transform="rotate(90 396 200)" text-anchor="middle">완료 조건별 PASS/FAIL 표</text>
  </g>
</svg>
