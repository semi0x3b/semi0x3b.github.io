<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" role="img" aria-label="dev 클러스터 네트워크: VCN 하나에 public·worker·api·db 서브넷을 두고, worker 서브넷에서 노드와 pod가 같은 IP 풀을 나눠 쓴다">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: currentColor; }
    .name { font-size: 13px; font-weight: 600; }
    .plain { font-size: 13px; }
    .sub { font-size: 11px; opacity: .7; }
    .mono { font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; opacity: .7; }
    .edge-lbl { font-size: 11px; opacity: .7; }
    .zone { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 4 3; rx: 8; opacity: .3; }
    .zone-lbl { font-size: 11px; font-weight: 600; opacity: .5; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.5; rx: 6; opacity: .55; }
    .box-hot { fill: none; stroke: #e8590c; stroke-width: 2; rx: 6; }
    .hot-txt { fill: #e8590c; font-size: 11px; }
    .flow { stroke: currentColor; stroke-width: 1.5; fill: none; opacity: .6; }
  </style>
  <defs>
    <marker id="n-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <rect x="20" y="24" width="660" height="256" class="zone"/>
  <text x="32" y="18" class="zone-lbl">VCN 10.0.0.0/16 · 리전 서울</text>

  <ellipse cx="72" cy="80" rx="42" ry="21" class="box"/>
  <text x="72" y="85" text-anchor="middle" class="plain">인터넷</text>

  <rect x="168" y="52" width="160" height="56" class="box"/>
  <text x="248" y="76" text-anchor="middle" class="name">public</text>
  <text x="248" y="95" text-anchor="middle" class="mono">10.0.0.0/24</text>

  <rect x="168" y="160" width="316" height="104" class="box-hot"/>
  <text x="326" y="184" text-anchor="middle" class="name">worker · 10.0.10.0/24</text>
  <rect x="186" y="196" width="130" height="52" class="box"/>
  <text x="251" y="218" text-anchor="middle" class="plain">워커 노드</text>
  <text x="251" y="236" text-anchor="middle" class="sub">E4.Flex 2 OCPU</text>
  <rect x="334" y="196" width="130" height="52" class="box"/>
  <text x="399" y="218" text-anchor="middle" class="plain">pod</text>
  <text x="399" y="236" text-anchor="middle" class="sub">노드당 31개</text>
  <text x="502" y="206" class="hot-txt">노드와 pod이 나눠 씀</text>
  <text x="502" y="226" class="sub">쓸 수 있는 IP는 251개</text>

  <rect x="520" y="52" width="150" height="56" class="box"/>
  <text x="595" y="76" text-anchor="middle" class="name">api</text>
  <text x="595" y="95" text-anchor="middle" class="mono">10.0.20.0/24</text>

  <rect x="20" y="160" width="118" height="56" class="box"/>
  <text x="79" y="184" text-anchor="middle" class="name">db</text>
  <text x="79" y="203" text-anchor="middle" class="mono">10.0.30.0/24</text>

  <path d="M116,80 L162,80" class="flow" marker-end="url(#n-ah)"/>
  <path d="M248,108 L248,154" class="flow" marker-end="url(#n-ah)"/>
  <path d="M168,222 L144,222" class="flow" marker-end="url(#n-ah)"/>
  <path d="M484,176 L560,176 L560,114" class="flow" marker-end="url(#n-ah)"/>

  <text x="122" y="72" class="edge-lbl">HTTPS</text>
  <text x="256" y="136" class="edge-lbl">로드밸런서가 전달</text>
  <text x="20" y="240" class="edge-lbl">앱 → PostgreSQL</text>
  <text x="492" y="171" class="edge-lbl">kubectl</text>
</svg>
