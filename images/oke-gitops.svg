<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -8 720 292" role="img" aria-label="배포와 비밀값 파이프라인: Git 매니페스트를 ArgoCD가 클러스터에 반영하고, OCI Vault 비밀값을 External Secrets가 쿠버네티스 Secret으로 만들며, cert-manager와 Kyverno가 인증서와 정책을 담당한다">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: currentColor; }
    .name { font-size: 13px; font-weight: 600; }
    .plain { font-size: 13px; }
    .sub { font-size: 11px; opacity: .7; }
    .edge-lbl { font-size: 11px; opacity: .7; }
    .zone { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 4 3; rx: 8; opacity: .3; }
    .zone-lbl { font-size: 11px; font-weight: 600; opacity: .5; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.5; rx: 6; opacity: .55; }
    .box-src { fill: none; stroke: #7a6b99; stroke-width: 1.8; rx: 6; }
    .flow { stroke: currentColor; stroke-width: 1.5; fill: none; opacity: .6; }
    .flow-dot { stroke: currentColor; stroke-width: 1.3; fill: none; stroke-dasharray: 5 3; opacity: .5; }
  </style>
  <defs>
    <marker id="g-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="20" y="18" class="zone-lbl">클러스터 밖 — 진실의 원천</text>
  <rect x="20" y="28" width="146" height="58" class="box-src"/>
  <text x="93" y="52" text-anchor="middle" class="name">Git 저장소</text>
  <text x="93" y="71" text-anchor="middle" class="sub">kustomize 매니페스트</text>

  <rect x="20" y="144" width="146" height="58" class="box-src"/>
  <text x="93" y="168" text-anchor="middle" class="name">OCI Vault</text>
  <text x="93" y="187" text-anchor="middle" class="sub">비밀값</text>

  <rect x="226" y="12" width="474" height="242" class="zone"/>
  <text x="238" y="6" class="zone-lbl">OKE 클러스터</text>

  <rect x="246" y="28" width="150" height="58" class="box"/>
  <text x="321" y="52" text-anchor="middle" class="name">ArgoCD</text>
  <text x="321" y="71" text-anchor="middle" class="sub">Application 66개</text>

  <rect x="246" y="144" width="150" height="58" class="box"/>
  <text x="321" y="168" text-anchor="middle" class="name">External Secrets</text>
  <text x="321" y="187" text-anchor="middle" class="sub">Secret으로 변환</text>

  <rect x="246" y="212" width="72" height="34" class="box"/>
  <text x="282" y="234" text-anchor="middle" class="plain">cert-manager</text>
  <rect x="326" y="212" width="70" height="34" class="box"/>
  <text x="361" y="234" text-anchor="middle" class="plain">Kyverno</text>

  <rect x="470" y="70" width="212" height="120" class="box"/>
  <text x="576" y="96" text-anchor="middle" class="name">네임스페이스별 워크로드</text>
  <text x="576" y="122" text-anchor="middle" class="plain">서비스 31종</text>
  <text x="576" y="144" text-anchor="middle" class="plain">채용 · 커뮤니티 각 7종</text>
  <text x="576" y="166" text-anchor="middle" class="plain">SaaS · 부트캠프 각 8종</text>

  <path d="M166,57 L240,57" class="flow" marker-end="url(#g-ah)"/>
  <path d="M396,66 L436,66 L436,104 L464,104" class="flow" marker-end="url(#g-ah)"/>
  <path d="M166,173 L240,173" class="flow" marker-end="url(#g-ah)"/>
  <path d="M396,164 L436,164 L436,138 L464,138" class="flow" marker-end="url(#g-ah)"/>
  <path d="M282,246 L282,258 L450,258 L450,176 L464,176" class="flow-dot" marker-end="url(#g-ah)"/>
  <path d="M396,232 L424,232 L424,190 L464,190" class="flow-dot" marker-end="url(#g-ah)"/>

  <text x="172" y="48" class="edge-lbl">감시</text>
  <text x="172" y="164" class="edge-lbl">조회</text>
  <text x="404" y="88" class="edge-lbl">sync</text>
  <text x="404" y="156" class="edge-lbl">Secret 주입</text>
  <text x="300" y="272" class="edge-lbl">TLS 발급</text>
  <text x="455" y="212" class="edge-lbl">정책 검사</text>
</svg>
