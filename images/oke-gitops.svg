<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="배포와 비밀값 파이프라인: Git 매니페스트를 ArgoCD가 클러스터에 반영하고, OCI Vault 비밀값을 External Secrets가 쿠버네티스 Secret으로 만들며, cert-manager와 Kyverno가 인증서와 정책을 담당하는 구조">
  <style>
    .lbl { font: 13px system-ui, -apple-system, sans-serif; fill: #24292f; }
    .lbl-sm { font: 11px system-ui, -apple-system, sans-serif; fill: #57606a; }
    .title { font: 600 13px system-ui, sans-serif; fill: #24292f; }
    .zone { fill: none; stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 4 3; rx: 8; }
    .zone-lbl { font: 600 11px system-ui, sans-serif; fill: #8c959f; letter-spacing: .03em; }
    .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; rx: 6; }
    .box-src { fill: #ffffff; stroke: #8250df; stroke-width: 1.8; rx: 6; }
    .box-w { fill: #ffffff; stroke: #1f883d; stroke-width: 1.8; rx: 6; }
    .flow { stroke: #656d76; stroke-width: 1.8; fill: none; marker-end: url(#g-ah); }
    .flow-dot { stroke: #656d76; stroke-width: 1.4; fill: none; stroke-dasharray: 5 3; marker-end: url(#g-ah); }
    @media (prefers-color-scheme: dark) {
      .lbl, .title { fill: #e6edf3; } .lbl-sm { fill: #8b949e; }
      .zone { stroke: #30363d; } .zone-lbl { fill: #6e7681; }
      .box { fill: #0d1117; stroke: #30363d; }
      .box-src { fill: #0d1117; stroke: #a371f7; }
      .box-w { fill: #0d1117; stroke: #3fb950; }
      .flow, .flow-dot { stroke: #8b949e; }
    }
    :root[data-theme="dark"] .lbl, :root[data-theme="dark"] .title { fill: #e6edf3; }
    :root[data-theme="dark"] .lbl-sm { fill: #8b949e; }
    :root[data-theme="dark"] .zone { stroke: #30363d; }
    :root[data-theme="dark"] .zone-lbl { fill: #6e7681; }
    :root[data-theme="dark"] .box { fill: #0d1117; stroke: #30363d; }
    :root[data-theme="dark"] .box-src { fill: #0d1117; stroke: #a371f7; }
    :root[data-theme="dark"] .box-w { fill: #0d1117; stroke: #3fb950; }
    :root[data-theme="dark"] .flow, :root[data-theme="dark"] .flow-dot { stroke: #8b949e; }
    :root[data-theme="light"] .lbl, :root[data-theme="light"] .title { fill: #24292f; }
    :root[data-theme="light"] .box { fill: #ffffff; stroke: #d0d7de; }
  </style>
  <defs>
    <marker id="g-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#656d76"/></marker>
  </defs>

  <text x="20" y="20" class="zone-lbl">클러스터 밖 — 진실의 원천</text>
  <rect x="20" y="30" width="150" height="62" class="box-src"/>
  <text x="95" y="55" text-anchor="middle" class="title">Git 저장소</text>
  <text x="95" y="74" text-anchor="middle" class="lbl-sm">kustomize 매니페스트</text>

  <rect x="20" y="150" width="150" height="62" class="box-src"/>
  <text x="95" y="175" text-anchor="middle" class="title">OCI Vault</text>
  <text x="95" y="194" text-anchor="middle" class="lbl-sm">비밀값</text>

  <rect x="230" y="14" width="470" height="270" class="zone"/>
  <text x="242" y="8" class="zone-lbl">OKE 클러스터</text>

  <rect x="250" y="30" width="150" height="62" class="box"/>
  <text x="325" y="55" text-anchor="middle" class="title">ArgoCD</text>
  <text x="325" y="74" text-anchor="middle" class="lbl-sm">Application 66개</text>

  <rect x="250" y="150" width="150" height="62" class="box"/>
  <text x="325" y="175" text-anchor="middle" class="title">External Secrets</text>
  <text x="325" y="194" text-anchor="middle" class="lbl-sm">Secret으로 변환</text>

  <rect x="250" y="228" width="72" height="42" class="box"/>
  <text x="286" y="254" text-anchor="middle" class="lbl">cert-manager</text>
  <rect x="330" y="228" width="70" height="42" class="box"/>
  <text x="365" y="254" text-anchor="middle" class="lbl">Kyverno</text>

  <rect x="470" y="80" width="210" height="130" class="box-w"/>
  <text x="575" y="108" text-anchor="middle" class="title">네임스페이스별 워크로드</text>
  <text x="575" y="132" text-anchor="middle" class="lbl">likelion 31종</text>
  <text x="575" y="154" text-anchor="middle" class="lbl">ats · lionhub 각 7종</text>
  <text x="575" y="176" text-anchor="middle" class="lbl">saas · campfire 각 8종</text>

  <path d="M170,61 L244,61" class="flow"/>
  <path d="M400,72 L440,72 L440,120 L464,120" class="flow"/>
  <path d="M170,181 L244,181" class="flow"/>
  <path d="M400,170 L440,170 L440,150 L464,150" class="flow"/>
  <path d="M286,270 L286,282 L446,282 L446,196 L464,196" class="flow-dot"/>
  <path d="M400,249 L430,249 L430,180 L464,180" class="flow-dot"/>

  <text x="176" y="52" class="lbl-sm">감시</text>
  <text x="176" y="172" class="lbl-sm">조회</text>
  <text x="412" y="112" class="lbl-sm">배포</text>
</svg>
