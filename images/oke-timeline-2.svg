    .axis { stroke: currentColor; stroke-width: 1.5; opacity: .35; }
    .dot { fill: currentColor; opacity: .8; }
    .dot-hl { fill: #43809c; }
  </style>

  <line x1="104" y1="24" x2="104" y2="316" class="axis"/>

