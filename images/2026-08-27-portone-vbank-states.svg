<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" role="img" aria-label="카드는 결제창을 닫는 순간 서버 검증만으로 결제가 확정되지만, 가상계좌는 발급 웹훅으로 입금 대기 상태가 되고 며칠 뒤 입금 웹훅이 와야 확정되며 입금이 없으면 기한 만료로 남는다" style="max-width:100%;height:auto">
  <defs>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
    <marker id="av-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="13" font-weight="600" fill="currentColor">카드</text>
  <text x="20" y="138" font-size="13" font-weight="600" fill="currentColor">가상계좌</text>

  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="20" y="42" width="140" height="46" rx="6" class="box-card-a"/>
    <rect x="290" y="42" width="140" height="46" rx="6" class="box-card-b"/>
    <rect x="20" y="152" width="140" height="46" rx="6" class="box-vb-a"/>
    <rect x="290" y="152" width="140" height="46" rx="6" class="box-vb-b"/>
    <rect x="530" y="152" width="150" height="46" rx="6" class="box-vb-c"/>
    <rect x="290" y="248" width="140" height="42" rx="6" class="box-vb-d"/>
  </g>

  <g font-size="13" text-anchor="middle" fill="currentColor">
    <text x="90" y="71">결제창을 닫음</text>
    <text x="360" y="71">결제 확정</text>
    <text x="90" y="181">결제창을 닫음</text>
    <text x="360" y="181">입금 대기</text>
    <text x="605" y="181">결제 확정</text>
    <text x="360" y="275">기한 만료</text>
  </g>

  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <path d="M165,65 L284,65" class="flow-card" marker-end="url(#av)"/>
    <path d="M165,175 L284,175" class="flow-vb1" marker-end="url(#av)"/>
    <path d="M435,175 L524,175" class="flow-vb2" marker-end="url(#av)"/>
  </g>
  <g stroke="#e8590c" stroke-width="1.5" fill="none">
    <path d="M360,203 L360,242" class="flow-vb3" marker-end="url(#av-o)"/>
  </g>

  <g font-size="11" text-anchor="middle" fill="currentColor">
    <text x="225" y="56">서버 검증 직후</text>
    <text x="225" y="166">발급 웹훅 · ready</text>
    <text x="225" y="192" opacity=".7">계좌번호만 나와요</text>
    <text x="480" y="166">입금 웹훅 · paid</text>
    <text x="480" y="192" opacity=".7">며칠 뒤예요</text>
  </g>
  <text x="374" y="228" font-size="11" fill="#e8590c" font-weight="600">돈이 안 들어오면</text>

  <text x="350" y="322" font-size="11" text-anchor="middle" fill="currentColor" opacity=".7">같은 결제번호로 웹훅이 두 번 와요 — 발급 때 한 번, 입금 때 한 번</text>
</svg>
