<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 330" role="img" aria-label="전문 에이전트 정의 파일 하나는 환경 값, 함정 목록, 진단 순서, 넘길 기준, 정책 결정 이력, 완료 조건의 여섯 부분으로 돼 있고 완료 조건이 마지막에 추가됐다" style="max-width:420px;width:100%;height:auto">
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="20" y="16" width="380" height="44" rx="5"/>
    <rect x="20" y="66" width="380" height="44" rx="5"/>
    <rect x="20" y="116" width="380" height="44" rx="5"/>
    <rect x="20" y="166" width="380" height="44" rx="5"/>
    <rect x="20" y="216" width="380" height="44" rx="5"/>
  </g>
  <rect x="20" y="266" width="380" height="44" rx="5" fill="none" stroke="#e8590c" stroke-width="1.5"/>

  <g font-size="14" fill="currentColor">
    <text x="36" y="35" font-weight="600">환경 값</text>
    <text x="36" y="52" font-size="12" opacity=".7">클러스터, 네임스페이스, 도메인, 이미지 저장소 확정값</text>
    <text x="36" y="85" font-weight="600">함정 목록</text>
    <text x="36" y="102" font-size="12" opacity=".7">한 번 밟은 실수와 회피법, 번호로 관리</text>
    <text x="36" y="135" font-weight="600">진단 순서</text>
    <text x="36" y="152" font-size="12" opacity=".7">"Pod가 안 떠요"에 대한 고정 4단계</text>
    <text x="36" y="185" font-weight="600">넘길 기준</text>
    <text x="36" y="202" font-size="12" opacity=".7">어떤 상황은 어느 에이전트로 넘기는가</text>
    <text x="36" y="235" font-weight="600">정책 결정 이력</text>
    <text x="36" y="252" font-size="12" opacity=".7">확정·거절한 선택과 다시 볼 조건, 날짜 포함</text>
    <text x="36" y="285" font-weight="600" fill="#e8590c">완료 조건</text>
    <text x="36" y="302" font-size="12" opacity=".7">실측 가능한 항목 4~6개, 검수자가 대조</text>
  </g>
</svg>
