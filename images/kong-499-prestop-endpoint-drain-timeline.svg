<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 470" role="img" aria-label="preStop 없이는 앱이 바로 꺼져 Kong이 그 사이 사라진 IP로 연결을 시도하다 클라이언트 타임아웃에 499가 나고, preStop 대기가 있으면 Kong이 파드를 빼고 난 뒤에 앱이 종료된다" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect width="420" height="470" fill="#FDFCFA"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/>
    </marker>
  </defs>

  <text x="107" y="28" font-size="13" font-weight="600" fill="#2b2b2b" text-anchor="middle">preStop 없음</text>
  <text x="312" y="28" font-size="13" font-weight="600" fill="#2b2b2b" text-anchor="middle">preStop sleep 15</text>

  <!-- 왼쪽 열 -->
  <rect x="20" y="44" width="175" height="60" rx="6" fill="none" stroke="#2b2b2b" stroke-width="1.2"/>
  <text x="107" y="64" font-size="12" fill="#2b2b2b" text-anchor="middle">파드 종료 시작</text>
  <text x="107" y="81" font-size="12" fill="#2b2b2b" text-anchor="middle" opacity=".7">Endpoints 제거 시작</text>
  <text x="107" y="97" font-size="12" fill="#2b2b2b" text-anchor="middle" opacity=".7">앱에 SIGTERM, 동시에</text>

  <line x1="107" y1="104" x2="107" y2="130" stroke="#2b2b2b" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="114" y="121" font-size="12" fill="#2b2b2b" opacity=".7">곧바로</text>

  <rect x="20" y="132" width="175" height="46" rx="6" fill="none" stroke="#2b2b2b" stroke-width="1.2"/>
  <text x="107" y="151" font-size="12" fill="#2b2b2b" text-anchor="middle">앱 종료</text>
  <text x="107" y="168" font-size="12" fill="#2b2b2b" text-anchor="middle" opacity=".7">그 IP는 응답 없음</text>

  <line x1="107" y1="178" x2="107" y2="204" stroke="#2b2b2b" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="114" y="195" font-size="12" fill="#2b2b2b" opacity=".7">그 사이</text>

  <rect x="20" y="206" width="175" height="60" rx="6" fill="none" stroke="#e8590c" stroke-width="1.6"/>
  <text x="107" y="226" font-size="12" fill="#2b2b2b" text-anchor="middle">Kong은 아직 옛 목록</text>
  <text x="107" y="243" font-size="12" fill="#2b2b2b" text-anchor="middle">사라진 IP로 connect</text>
  <text x="107" y="259" font-size="12" fill="#2b2b2b" text-anchor="middle" opacity=".7">연결이 매달림</text>

  <line x1="107" y1="266" x2="107" y2="292" stroke="#2b2b2b" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="114" y="283" font-size="12" fill="#2b2b2b" opacity=".7">몇 초 뒤</text>

  <rect x="20" y="294" width="175" height="46" rx="6" fill="none" stroke="#2b2b2b" stroke-width="1.2"/>
  <text x="107" y="313" font-size="12" fill="#2b2b2b" text-anchor="middle">KIC가 Kong 목록에서 뺌</text>
  <text x="107" y="330" font-size="12" fill="#2b2b2b" text-anchor="middle" opacity=".7">매달린 연결은 그대로</text>

  <line x1="107" y1="340" x2="107" y2="366" stroke="#2b2b2b" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="114" y="357" font-size="12" fill="#2b2b2b" opacity=".7">타임아웃 뒤</text>

  <rect x="20" y="368" width="175" height="46" rx="6" fill="#e8590c" stroke="#e8590c" stroke-width="1.2"/>
  <text x="107" y="387" font-size="12" font-weight="600" fill="#FDFCFA" text-anchor="middle">클라이언트 포기</text>
  <text x="107" y="404" font-size="12" fill="#FDFCFA" text-anchor="middle">Kong 로그 499</text>

  <!-- 오른쪽 열 -->
  <rect x="225" y="44" width="175" height="60" rx="6" fill="none" stroke="#2b2b2b" stroke-width="1.2"/>
  <text x="312" y="64" font-size="12" fill="#2b2b2b" text-anchor="middle">파드 종료 시작</text>
  <text x="312" y="81" font-size="12" fill="#2b2b2b" text-anchor="middle" opacity=".7">Endpoints 제거 시작</text>
  <text x="312" y="97" font-size="12" fill="#2b2b2b" text-anchor="middle" opacity=".7">preStop 훅 실행, 동시에</text>

  <line x1="312" y1="104" x2="312" y2="130" stroke="#2b2b2b" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="319" y="121" font-size="12" fill="#2b2b2b" opacity=".7">곧바로</text>

  <rect x="225" y="132" width="175" height="46" rx="6" fill="none" stroke="#e8590c" stroke-width="1.6"/>
  <text x="312" y="151" font-size="12" fill="#2b2b2b" text-anchor="middle">sleep 15</text>
  <text x="312" y="168" font-size="12" fill="#2b2b2b" text-anchor="middle" opacity=".7">앱은 그대로 요청 처리</text>

  <line x1="312" y1="178" x2="312" y2="204" stroke="#2b2b2b" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="319" y="195" font-size="12" fill="#2b2b2b" opacity=".7">그 사이</text>

  <rect x="225" y="206" width="175" height="60" rx="6" fill="none" stroke="#2b2b2b" stroke-width="1.2"/>
  <text x="312" y="226" font-size="12" fill="#2b2b2b" text-anchor="middle">KIC가 Kong 목록에서 뺌</text>
  <text x="312" y="243" font-size="12" fill="#2b2b2b" text-anchor="middle">새 요청이 더 안 옴</text>
  <text x="312" y="259" font-size="12" fill="#2b2b2b" text-anchor="middle" opacity=".7">앱은 아직 살아 있음</text>

  <line x1="312" y1="266" x2="312" y2="292" stroke="#2b2b2b" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="319" y="283" font-size="12" fill="#2b2b2b" opacity=".7">sleep 끝나면</text>

  <rect x="225" y="294" width="175" height="46" rx="6" fill="none" stroke="#2b2b2b" stroke-width="1.2"/>
  <text x="312" y="313" font-size="12" fill="#2b2b2b" text-anchor="middle">앱에 SIGTERM</text>
  <text x="312" y="330" font-size="12" fill="#2b2b2b" text-anchor="middle" opacity=".7">받던 요청 없이 종료</text>

  <line x1="312" y1="340" x2="312" y2="366" stroke="#2b2b2b" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="319" y="357" font-size="12" fill="#2b2b2b" opacity=".7">결과</text>

  <rect x="225" y="368" width="175" height="46" rx="6" fill="none" stroke="#2b2b2b" stroke-width="1.2"/>
  <text x="312" y="387" font-size="12" font-weight="600" fill="#2b2b2b" text-anchor="middle">끊기는 요청 없음</text>
  <text x="312" y="404" font-size="12" fill="#2b2b2b" text-anchor="middle" opacity=".7">IP는 Kong이 뺀 뒤에 사라짐</text>

  <text x="210" y="452" font-size="12" fill="#2b2b2b" text-anchor="middle" opacity=".7">KIC = Kong Ingress Controller</text>
</svg>
