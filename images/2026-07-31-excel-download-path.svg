<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 630" role="img" aria-label="관리자 엑셀 다운로드 한 번이 지나가는 길. 화면이 사유와 항목을 쿼리로, 파일 암호를 헤더로 보내면 서버가 요청을 검증하고 가리지 않은 원본을 읽어 시트를 만든 뒤 일련번호를 각인하고 암호를 걸어 내려준다. 검증을 통과한 요청은 같은 시점에 다운로드 기록으로도 남는다">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: currentColor; }
    .name { font-size: 13px; font-weight: 600; }
    .plain { font-size: 13px; }
    .sub { font-size: 11px; opacity: .7; }
    .edge-lbl { font-size: 11px; opacity: .7; }
    .zone-lbl { font-size: 11px; font-weight: 600; opacity: .5; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.5; rx: 6; opacity: .55; }
    .box-key { fill: none; stroke: #c24634; stroke-width: 1.8; rx: 6; }
    .key-lbl { font-size: 11px; fill: #c24634; }
    .flow { stroke: currentColor; stroke-width: 1.6; fill: none; opacity: .6; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
  </defs>

  <rect x="120" y="20" width="340" height="56" class="box"/>
  <text x="290" y="44" text-anchor="middle" class="name">관리자 화면</text>
  <text x="290" y="63" text-anchor="middle" class="sub">사유·내려받을 항목·파일 암호를 입력해요</text>

  <rect x="120" y="130" width="340" height="56" class="box-key"/>
  <text x="290" y="154" text-anchor="middle" class="name">요청 검증</text>
  <text x="290" y="173" text-anchor="middle" class="sub">사유가 있나, 항목이 허용 목록 안인가</text>

  <rect x="120" y="240" width="340" height="56" class="box-key"/>
  <text x="290" y="264" text-anchor="middle" class="name">원본 조회</text>
  <text x="290" y="283" text-anchor="middle" class="sub">화면과 달리 가리지 않은 값을 읽어요</text>

  <rect x="120" y="350" width="340" height="56" class="box"/>
  <text x="290" y="374" text-anchor="middle" class="name">일련번호 각인</text>
  <text x="290" y="393" text-anchor="middle" class="sub">문서 속성과 숨김 시트에 파일마다 다른 번호를</text>

  <rect x="120" y="460" width="340" height="56" class="box-key"/>
  <text x="290" y="484" text-anchor="middle" class="name">암호 걸기</text>
  <text x="290" y="503" text-anchor="middle" class="sub">입력받은 암호로 파일을 잠가요</text>

  <rect x="120" y="570" width="340" height="44" class="box"/>
  <text x="290" y="597" text-anchor="middle" class="plain">잠긴 파일이 내려와요</text>

  <rect x="530" y="240" width="230" height="96" class="box"/>
  <text x="645" y="266" text-anchor="middle" class="name">다운로드 기록</text>
  <text x="645" y="288" text-anchor="middle" class="sub">누가 언제 무엇을 왜 받았는지</text>
  <text x="645" y="306" text-anchor="middle" class="sub">일련번호와 암호 출처까지</text>
  <text x="645" y="326" text-anchor="middle" class="sub">한 곳에 모아 남겨요</text>

  <path d="M290,76 L290,124" class="flow" marker-end="url(#ah)"/>
  <path d="M290,186 L290,234" class="flow" marker-end="url(#ah)"/>
  <path d="M290,296 L290,344" class="flow" marker-end="url(#ah)"/>
  <path d="M290,406 L290,454" class="flow" marker-end="url(#ah)"/>
  <path d="M290,516 L290,564" class="flow" marker-end="url(#ah)"/>
  <path d="M462,158 L496,158 L496,268 L524,268" class="flow" marker-end="url(#ah)"/>

  <text x="300" y="104" class="edge-lbl">사유·항목은 주소 뒤에, 암호는 헤더에</text>
  <text x="300" y="214" class="edge-lbl">검증을 통과한 요청만</text>
  <text x="300" y="324" class="edge-lbl">고른 항목만 시트로</text>
  <text x="300" y="434" class="edge-lbl">번호를 심은 뒤에</text>
  <text x="300" y="544" class="edge-lbl">암호를 건 채로</text>
  <text x="472" y="150" class="edge-lbl">같은 요청을 기록으로</text>
</svg>
