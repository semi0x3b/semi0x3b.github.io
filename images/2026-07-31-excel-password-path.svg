<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" role="img" aria-label="다운로드 요청이 서비스에 닿기까지 콘텐츠 배달망·로드밸런서·웹 서버 세 길목을 지난다. 파일 암호를 주소 뒤에 실으면 세 길목의 접근 로그에 평문으로 남지만, 요청 헤더로 보내면 남지 않는 대신 주소창만으로는 파일을 받을 수 없다">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: currentColor; }
    .name { font-size: 13px; font-weight: 600; }
    .plain { font-size: 13px; }
    .sub { font-size: 11px; opacity: .7; }
    .edge-lbl { font-size: 11px; opacity: .7; }
    .zone { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 4 3; rx: 8; opacity: .3; }
    .zone-lbl { font-size: 11px; font-weight: 600; opacity: .5; }
    .zone-lbl-bad { font-size: 11px; font-weight: 600; fill: #c24634; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.5; rx: 6; opacity: .55; }
    .flow { stroke: currentColor; stroke-width: 1.6; fill: none; opacity: .6; }
    .bad { font-size: 12px; fill: #c24634; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
  </defs>

  <rect x="320" y="20" width="180" height="44" class="box"/>
  <text x="410" y="47" text-anchor="middle" class="plain">브라우저</text>

  <rect x="320" y="110" width="180" height="44" class="box"/>
  <text x="410" y="137" text-anchor="middle" class="plain">콘텐츠 배달망</text>

  <rect x="320" y="196" width="180" height="44" class="box"/>
  <text x="410" y="223" text-anchor="middle" class="plain">로드밸런서</text>

  <rect x="320" y="282" width="180" height="44" class="box"/>
  <text x="410" y="309" text-anchor="middle" class="plain">웹 서버</text>

  <rect x="320" y="368" width="180" height="44" class="box"/>
  <text x="410" y="395" text-anchor="middle" class="plain">우리 서비스</text>

  <path d="M410,64 L410,104" class="flow" marker-end="url(#ah)"/>
  <path d="M410,154 L410,190" class="flow" marker-end="url(#ah)"/>
  <path d="M410,240 L410,276" class="flow" marker-end="url(#ah)"/>
  <path d="M410,326 L410,362" class="flow" marker-end="url(#ah)"/>

  <text x="420" y="90" class="edge-lbl">다운로드 요청</text>
  <text x="420" y="176" class="edge-lbl">그대로 넘김</text>
  <text x="420" y="262" class="edge-lbl">그대로 넘김</text>
  <text x="420" y="348" class="edge-lbl">우리 코드에 도착</text>

  <rect x="20" y="100" width="270" height="230" class="zone"/>
  <text x="32" y="92" class="zone-lbl-bad">주소 뒤에 실었다면</text>
  <text x="40" y="132" class="bad">세 길목이 요청 주소를</text>
  <text x="40" y="152" class="bad">통째로 접근 로그에 적어요</text>
  <text x="40" y="192" class="bad">암호가 평문으로 남아요</text>
  <text x="40" y="232" class="bad">파일을 잠근 의미가</text>
  <text x="40" y="252" class="bad">사라져요</text>

  <rect x="530" y="100" width="270" height="230" class="zone"/>
  <text x="542" y="92" class="zone-lbl">헤더로 보내면</text>
  <text x="550" y="132" class="plain">세 길목의 기본 기록</text>
  <text x="550" y="152" class="plain">항목이 아니에요</text>
  <text x="550" y="192" class="plain">대신 주소창을 열어</text>
  <text x="550" y="212" class="plain">받는 방식은 못 써요</text>
  <text x="550" y="252" class="sub">화면이 스크립트로 요청을</text>
  <text x="550" y="270" class="sub">만들고 응답을 파일로 저장해요</text>
</svg>
