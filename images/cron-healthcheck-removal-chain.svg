<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 868 250" role="img" aria-label="15분마다 도는 헬스체크의 다섯 단계. 도메인 확인과 실패 판정까지는 돌았지만, 실패를 알리는 이슈가 한 건도 만들어지지 않아 사람에게 아무것도 닿지 않았어요.">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <g fill="currentColor" font-family="system-ui, -apple-system, sans-serif">

    <!-- 비용 주석 -->
    <text x="262" y="38" font-size="11" text-anchor="middle" opacity=".7">도메인마다 청구 단위가 따로 잡혀 다섯 배가 됐어요</text>
    <path d="M 262 52 L 262 68" stroke="currentColor" stroke-width="1" opacity=".4" marker-end="url(#ah)" fill="none"/>

    <!-- 박스 1 -->
    <rect x="20" y="70" width="140" height="52" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="90" y="101" font-size="13" font-weight="600" text-anchor="middle">15분마다 실행</text>

    <!-- 박스 2 -->
    <rect x="192" y="70" width="140" height="52" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="262" y="101" font-size="13" font-weight="600" text-anchor="middle">도메인 5개 확인</text>

    <!-- 박스 3 -->
    <rect x="364" y="70" width="140" height="52" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="434" y="101" font-size="13" font-weight="600" text-anchor="middle">실패로 판정</text>

    <!-- 박스 4 — 여기서부터 실행되지 않음 -->
    <rect x="536" y="70" width="140" height="52" rx="6" fill="none" stroke="#c24634" stroke-width="1.2" stroke-dasharray="5 4" opacity=".55"/>
    <text x="606" y="101" font-size="13" font-weight="600" text-anchor="middle" fill="#c24634" opacity=".7">이슈 자동 생성</text>

    <!-- 박스 5 -->
    <rect x="708" y="70" width="140" height="52" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".3"/>
    <text x="778" y="101" font-size="13" font-weight="600" text-anchor="middle" opacity=".3">사람이 본다</text>

    <!-- 화살표 -->
    <path d="M 160 96 L 190 96" stroke="currentColor" stroke-width="1.2" marker-end="url(#ah)" fill="none"/>
    <path d="M 332 96 L 362 96" stroke="currentColor" stroke-width="1.2" marker-end="url(#ah)" fill="none"/>
    <path d="M 504 96 L 534 96" stroke="#c24634" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/>
    <path d="M 513 88 L 525 104 M 525 88 L 513 104" stroke="#c24634" stroke-width="1.4" fill="none"/>
    <path d="M 676 96 L 706 96" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 4" opacity=".3" marker-end="url(#ah)" fill="none"/>

    <!-- 아래 주석 -->
    <text x="262" y="146" font-size="11" text-anchor="middle" opacity=".7">멀쩡한데 실패로 나왔어요</text>

    <text x="606" y="146" font-size="11" text-anchor="middle" fill="#c24634">한 번도</text>
    <text x="606" y="162" font-size="11" text-anchor="middle" fill="#c24634">만들어지지 않았어요</text>

    <text x="20" y="205" font-size="11" opacity=".7">실패까지는 제대로 갔는데, 그다음이 통째로 비어 있었어요.</text>
  </g>
</svg>
