<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" role="img" aria-label="사용자 요청은 게이트웨이를 지나며 신원이 심어져 관리자 경로를 통과하지만, 결제 서비스가 직접 부르는 서버간 호출은 게이트웨이를 거치지 않아 신원이 없고 같은 관리자 경로에서 거절당한다" style="max-width:100%;height:auto">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
    <marker id="ar-x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/>
    </marker>
  </defs>

  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="16" y="40" width="122" height="46" rx="6"/>
    <rect x="214" y="40" width="132" height="46" rx="6"/>
    <rect x="16" y="196" width="122" height="46" rx="6"/>
    <rect x="452" y="112" width="196" height="58" rx="6"/>
  </g>

  <g font-size="13" text-anchor="middle" fill="currentColor">
    <text x="77" y="69">사용자</text>
    <text x="280" y="63">게이트웨이</text>
    <text x="77" y="225">결제 서비스</text>
    <text x="550" y="136" font-weight="600">권한 서비스</text>
    <text x="550" y="155">관리자 경로</text>
  </g>
  <text x="280" y="79" font-size="11" text-anchor="middle" fill="currentColor" opacity=".7">신원을 심어요</text>

  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <line x1="138" y1="63" x2="208" y2="63" marker-end="url(#ar)"/>
    <polyline points="346,63 396,63 396,126 446,126" marker-end="url(#ar)"/>
  </g>
  <g stroke="#e8590c" stroke-width="1.5" fill="none">
    <polyline points="138,219 396,219 396,156 446,156" marker-end="url(#ar-x)"/>
  </g>

  <g font-size="11" fill="currentColor">
    <text x="173" y="54" text-anchor="middle" opacity=".7">요청</text>
    <text x="404" y="100">신원 있음 → 통과</text>
  </g>
  <g font-size="11" fill="#e8590c">
    <text x="404" y="192" font-weight="600">신원 없음 → 거절</text>
    <text x="267" y="211" text-anchor="middle" font-weight="600">게이트웨이를 거치지 않아요</text>
  </g>

  <text x="267" y="272" font-size="11" text-anchor="middle" fill="currentColor" opacity=".7">같은 엔드포인트인데, 어느 경로로 왔느냐가 갈랐어요</text>
</svg>
