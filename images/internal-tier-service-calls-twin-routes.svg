<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-label="관리자는 게이트웨이를 지나 신원이 심어진 채 관리자 경로로 들어오고, 다른 서비스는 게이트웨이를 거치지 않고 내부용 경로로 들어온다. 두 경로는 같은 내부 로직을 불러 같은 응답을 돌려준다" style="max-width:100%;height:auto">
  <defs>
    <marker id="twin-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="20" y="40" width="130" height="48" rx="6" class="box-admin"/>
    <rect x="200" y="40" width="130" height="48" rx="6" class="box-gateway"/>
    <rect x="390" y="32" width="150" height="56" rx="6" class="box-adminroute"/>
    <rect x="20" y="200" width="130" height="48" rx="6" class="box-service"/>
    <rect x="390" y="192" width="150" height="56" rx="6" class="box-internalroute"/>
    <rect x="580" y="108" width="120" height="64" rx="6" class="box-logic"/>
  </g>

  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <path d="M150,64 L196,64" class="flow-a" marker-end="url(#twin-ar)"/>
    <path d="M330,60 L386,60" class="flow-b" marker-end="url(#twin-ar)"/>
    <path d="M150,224 L386,224" class="flow-c" marker-end="url(#twin-ar)"/>
    <path d="M540,60 L560,60 L560,126 L576,126" class="flow-d" marker-end="url(#twin-ar)"/>
    <path d="M540,224 L560,224 L560,154 L576,154" class="flow-e" marker-end="url(#twin-ar)"/>
  </g>

  <g font-size="13" text-anchor="middle" fill="currentColor">
    <text x="85" y="69">백오피스 관리자</text>
    <text x="265" y="62">게이트웨이</text>
    <text x="465" y="55" font-weight="600">관리자 경로</text>
    <text x="85" y="229">다른 서비스</text>
    <text x="465" y="215" font-weight="600">내부용 경로</text>
    <text x="640" y="135">같은</text>
    <text x="640" y="155">내부 로직</text>
  </g>

  <g font-size="11" text-anchor="middle" fill="currentColor" opacity=".7">
    <text x="265" y="80">신원을 심어요</text>
    <text x="465" y="76">신원 검사가 있어요</text>
    <text x="465" y="236">신원 검사가 없어요</text>
    <text x="358" y="55">신원 있음</text>
    <text x="268" y="216">게이트웨이를 안 거쳐요</text>
    <text text-anchor="start" x="568" y="96">같은 로직을 불러요</text>
  </g>

  <text x="360" y="312" font-size="11" text-anchor="middle" fill="currentColor" opacity=".7">응답 형태가 같아야 부르는 쪽이 주소 한 줄만 바꿔요</text>
</svg>
