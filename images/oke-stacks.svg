<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-label="Terraform 스택 구조: platform 스택이 VCN·OKE·Vault·IAM을 만들고 database, keycloak, saas, ats, campfire 다섯 스택이 그 위에 나란히 얹힌다">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: currentColor; }
    .name { font-size: 13px; }
    .sub { font-size: 11px; opacity: .7; }
    .edge-lbl { font-size: 11px; opacity: .7; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.5; rx: 6; opacity: .55; }
    .box-base { fill: none; stroke: #43809c; stroke-width: 2; rx: 6; }
    .flow { stroke: currentColor; stroke-width: 1.5; fill: none; opacity: .6; }
  </style>
  <defs>
    <marker id="s-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="112" height="44" class="box"/>
  <text x="76" y="47" text-anchor="middle" class="name">database</text>
  <rect x="144" y="20" width="112" height="44" class="box"/>
  <text x="200" y="47" text-anchor="middle" class="name">keycloak</text>
  <rect x="268" y="20" width="112" height="44" class="box"/>
  <text x="324" y="47" text-anchor="middle" class="name">saas</text>
  <rect x="392" y="20" width="112" height="44" class="box"/>
  <text x="448" y="47" text-anchor="middle" class="name">ats</text>
  <rect x="516" y="20" width="104" height="44" class="box"/>
  <text x="568" y="47" text-anchor="middle" class="name">campfire</text>

  <path d="M76,118 L76,70" class="flow" marker-end="url(#s-ah)"/>
  <path d="M200,118 L200,70" class="flow" marker-end="url(#s-ah)"/>
  <path d="M324,118 L324,70" class="flow" marker-end="url(#s-ah)"/>
  <path d="M448,118 L448,70" class="flow" marker-end="url(#s-ah)"/>
  <path d="M568,118 L568,70" class="flow" marker-end="url(#s-ah)"/>
  <path d="M76,118 L568,118" class="flow"/>
  <path d="M320,158 L320,120" class="flow"/>

  <text x="332" y="140" class="edge-lbl">remote state로 VCN·서브넷 id 참조</text>

  <rect x="196" y="158" width="248" height="66" class="box-base"/>
  <text x="320" y="186" text-anchor="middle" class="name">platform</text>
  <text x="320" y="206" text-anchor="middle" class="sub">VCN · OKE · Vault · IAM</text>
</svg>
