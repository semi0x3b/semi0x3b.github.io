<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Terraform 스택 구조: platform 스택이 VCN·OKE·Vault·IAM을 만들고 database, keycloak, saas, ats, campfire 다섯 스택이 그 위에 나란히 얹히는 구조">
  <style>
    .lbl { font: 13px system-ui, -apple-system, sans-serif; fill: #24292f; }
    .lbl-sm { font: 11px system-ui, -apple-system, sans-serif; fill: #57606a; }
    .title { font: 600 13px system-ui, sans-serif; fill: #24292f; }
    .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; rx: 6; }
    .box-base { fill: #ffffff; stroke: #0969da; stroke-width: 2; rx: 6; }
    .flow { stroke: #656d76; stroke-width: 1.6; fill: none; marker-end: url(#s-ah); }
    @media (prefers-color-scheme: dark) {
      .lbl, .title { fill: #e6edf3; } .lbl-sm { fill: #8b949e; }
      .box { fill: #0d1117; stroke: #30363d; }
      .box-base { fill: #0d1117; stroke: #58a6ff; }
      .flow { stroke: #8b949e; }
    }
    :root[data-theme="dark"] .lbl, :root[data-theme="dark"] .title { fill: #e6edf3; }
    :root[data-theme="dark"] .lbl-sm { fill: #8b949e; }
    :root[data-theme="dark"] .box { fill: #0d1117; stroke: #30363d; }
    :root[data-theme="dark"] .box-base { fill: #0d1117; stroke: #58a6ff; }
    :root[data-theme="dark"] .flow { stroke: #8b949e; }
    :root[data-theme="light"] .lbl, :root[data-theme="light"] .title { fill: #24292f; }
    :root[data-theme="light"] .box { fill: #ffffff; stroke: #d0d7de; }
  </style>
  <defs>
    <marker id="s-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#656d76"/></marker>
  </defs>

  <!-- 위: 서비스 스택 5개 나란히 -->
  <rect x="20" y="20" width="112" height="44" class="box"/>
  <text x="76" y="47" text-anchor="middle" class="lbl">database</text>
  <rect x="144" y="20" width="112" height="44" class="box"/>
  <text x="200" y="47" text-anchor="middle" class="lbl">keycloak</text>
  <rect x="268" y="20" width="112" height="44" class="box"/>
  <text x="324" y="47" text-anchor="middle" class="lbl">saas</text>
  <rect x="392" y="20" width="112" height="44" class="box"/>
  <text x="448" y="47" text-anchor="middle" class="lbl">ats</text>
  <rect x="516" y="20" width="104" height="44" class="box"/>
  <text x="568" y="47" text-anchor="middle" class="lbl">campfire</text>

  <!-- 각 스택 → 가로 간선 (위로 향하는 화살표) -->
  <path d="M76,118 L76,70" class="flow"/>
  <path d="M200,118 L200,70" class="flow"/>
  <path d="M324,118 L324,70" class="flow"/>
  <path d="M448,118 L448,70" class="flow"/>
  <path d="M568,118 L568,70" class="flow"/>

  <!-- 가로 간선 -->
  <path d="M76,118 L568,118" stroke="#656d76" stroke-width="1.6" fill="none"/>
  <path d="M320,158 L320,120" stroke="#656d76" stroke-width="1.6" fill="none"/>

  <!-- 아래: platform -->
  <rect x="196" y="158" width="248" height="70" class="box-base"/>
  <text x="320" y="186" text-anchor="middle" class="title">platform</text>
  <text x="320" y="207" text-anchor="middle" class="lbl-sm">VCN · OKE · Vault · IAM</text>

  <text x="20" y="258" class="lbl-sm">platform이 네트워크와 클러스터를 만들고, 다섯 스택이 그 위에 나란히 얹혀요.</text>
  <text x="20" y="278" class="lbl-sm">state를 하나로 두지 않아서 한 스택의 사고가 다른 스택으로 번지지 않아요.</text>
</svg>
