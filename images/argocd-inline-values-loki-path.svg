<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" role="img" aria-label="Application 설정 안의 비밀값이 repo-server 로그를 거쳐 Loki에 평문으로 쌓이는 길과, 출처와 수집 단계와 저장소에서 한 조치">
  <rect width="400" height="560" fill="#FDFCFA"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" fill="#2b2b2b">
    <!-- Application -->
    <rect x="40" y="20" width="320" height="84" rx="8" fill="none" stroke="#2b2b2b" stroke-width="1.5"/>
    <text x="200" y="45" font-size="14" font-weight="600" text-anchor="middle">ArgoCD Application 설정</text>
    <text x="200" y="66" font-size="12" text-anchor="middle" opacity=".7">helm.values 안에 DB 비밀번호와 키가 평문</text>
    <text x="200" y="88" font-size="12" text-anchor="middle" opacity=".7">남은 일: 비밀을 Secret 참조로 옮기기</text>

    <line x1="200" y1="104" x2="200" y2="142" stroke="#2b2b2b" stroke-width="1.5"/>
    <polygon points="195,136 205,136 200,144" fill="#2b2b2b"/>
    <text x="214" y="128" font-size="12" opacity=".7">렌더링</text>

    <!-- repo-server -->
    <rect x="40" y="146" width="320" height="80" rx="8" fill="none" stroke="#2b2b2b" stroke-width="1.5"/>
    <text x="200" y="171" font-size="14" font-weight="600" text-anchor="middle">repo-server 로그 (출처)</text>
    <text x="200" y="192" font-size="12" text-anchor="middle" opacity=".7">info 줄에 values 전체가 들어감</text>
    <text x="200" y="213" font-size="12" font-weight="600" text-anchor="middle" fill="#e8590c">조치 1 · 로그 레벨 warn</text>

    <line x1="200" y1="226" x2="200" y2="264" stroke="#2b2b2b" stroke-width="1.5"/>
    <polygon points="195,258 205,258 200,266" fill="#2b2b2b"/>
    <text x="214" y="250" font-size="12" opacity=".7">줄 단위로 읽어 전달</text>

    <!-- Alloy -->
    <rect x="40" y="268" width="320" height="80" rx="8" fill="none" stroke="#2b2b2b" stroke-width="1.5"/>
    <text x="200" y="293" font-size="14" font-weight="600" text-anchor="middle">Alloy 수집기 (수집 단계)</text>
    <text x="200" y="314" font-size="12" text-anchor="middle" opacity=".7">값을 가리는 단계가 없었음</text>
    <text x="200" y="335" font-size="12" font-weight="600" text-anchor="middle" fill="#e8590c">조치 2 · 값을 *** 로 가리기</text>

    <line x1="200" y1="348" x2="200" y2="386" stroke="#2b2b2b" stroke-width="1.5"/>
    <polygon points="195,380 205,380 200,388" fill="#2b2b2b"/>
    <text x="214" y="372" font-size="12" opacity=".7">저장</text>

    <!-- Loki -->
    <rect x="40" y="390" width="320" height="96" rx="8" fill="none" stroke="#2b2b2b" stroke-width="1.5"/>
    <text x="200" y="415" font-size="14" font-weight="600" text-anchor="middle">Loki (저장소)</text>
    <text x="200" y="436" font-size="12" text-anchor="middle" opacity=".7">30일 보관, 접근 권한이 있으면 검색 가능</text>
    <text x="200" y="457" font-size="12" text-anchor="middle" opacity=".7">백업은 관리자만 접근</text>
    <text x="200" y="476" font-size="12" font-weight="600" text-anchor="middle" fill="#e8590c">조치 3 · 백업 뒤 디스크 재생성</text>

    <line x1="200" y1="486" x2="200" y2="524" stroke="#2b2b2b" stroke-width="1.5"/>
    <polygon points="195,518 205,518 200,526" fill="#2b2b2b"/>
    <text x="214" y="510" font-size="12" opacity=".7">Grafana 검색</text>

    <!-- 조치 전 상태 -->
    <rect x="40" y="528" width="320" height="26" rx="8" fill="none" stroke="#e8590c" stroke-width="1.5"/>
    <text x="200" y="546" font-size="12" font-weight="600" text-anchor="middle">조치 전: 검색 한 번으로 비밀값 열람 가능</text>
  </g>
</svg>
